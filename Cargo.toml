[package]
name = "dedupe"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Find duplicate files (including images and videos) by content hash, with media metadata comparison"
license = "MIT"
publish = false

[[bin]]
name = "dedupe"
path = "src/main.rs"

# Lints live here rather than as crate attributes so every target agrees.
# CI (and prek) turns these into errors with `cargo clippy -- -D warnings`.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"

[dependencies]
anyhow = "1.0.104"
# bincode 3.0.0 is an upstream tombstone release (the project is unmaintained);
# 2.0.1 is the last usable version. The serde feature is required for the
# cache's Serialize/Deserialize structs.
bincode = { version = "2.0.1", features = ["serde"] }
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff", "ico"] }
indicatif = "0.18.6"
md-5 = "0.11.0"
# Native Shell: the GUI is an nsh app written in Rust. `nsh-base` holds the
# unstyled behavior components; the styled layer lives in `src/ui`.
nsh-base = { version = "0.4.0", default-features = false }
nsh-core = "0.4.0"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
same-file = "1.0.6"
trash = "5.2.9"
walkdir = "2.5.0"

# nsh runs on the OS's own backend, so the platform crate is picked per
# target. `default-features = false` drops the embedded JS runtime (`js`):
# this app is Rust-only.
[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }
# The direct Win32 calls in `src/ui/window_state.rs` (window placement
# save/restore and the single-instance mutex). nsh-platform-windows
# already enables a superset of these windows-rs features, so this adds
# no extra compiled code; it just makes the listed APIs visible to this
# crate, which resolves its own dependency graph.
windows = { version = "0.62", features = [
    "std",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json = "1.0.154"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
nsh-engine = { version = "0.4.0", default-features = false }
nsh-testing = { version = "0.4.0", default-features = false }

[build-dependencies]
winres = "0.1.12"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The text-shaping and layout stack is slow in debug builds; optimizing only
# those dependencies keeps the GUI responsive while our own code stays
# debuggable.
[profile.dev.package]
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
