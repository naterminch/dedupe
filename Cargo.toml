[package]
name = "dedupe"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Find duplicate files (including images and videos) by content hash, with media metadata comparison"
license = "MIT"
publish = false

[[bin]]
name = "dedupe"
path = "src/main.rs"

[[bin]]
name = "dedupe-gui"
path = "src/gui_main.rs"

# Lints live here rather than as crate attributes so every target agrees.
# CI (and prek) turns these into errors with `cargo clippy -- -D warnings`.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"

[dependencies]
anyhow = "1.0.104"
# bincode 3.0.0 is an upstream tombstone release (the project is unmaintained);
# 2.0.1 is the last usable version. The serde feature is required for the
# cache's Serialize/Deserialize structs.
bincode = { version = "2.0.1", features = ["serde"] }
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
gpui-kit = "0.8.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff", "ico"] }
indicatif = "0.18.6"
md-5 = "0.11.0"
open = "5.4.5"
rayon = "1.12.0"
rfd = "0.17.2"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
same-file = "1.0.6"
trash = "5.2.9"
walkdir = "2.5.0"

[dev-dependencies]
serde_json = "1.0.154"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# test-support unlocks gpui-kit's headless window harness (TestAppContext,
# TestWindowExt) for the UI tests in src/ui_tests.rs.
gpui-kit = { version = "0.8.1", features = ["test-support"] }

[build-dependencies]
winres = "0.1.12"

[profile.release]
lto = true
codegen-units = 1
strip = true

# GPUI renders much more smoothly in debug builds when the framework itself
# is optimized (per the gpui-kit installation guide). This only affects the
# listed dependencies; our own code stays debuggable.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
