name: Tests

# Full suite (fmt, clippy, tests) runs on Ubuntu only. Windows and macOS
# get a compile check so platform-specific code can't break silently —
# release builds cover all three OSes anyway.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  prek:
    name: Prek hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # cargo clippy --all-targets compiles the GUI: nsh's Linux backend is
      # GTK 4 (docs/installation), and rfd's file dialogs build against
      # libwayland. WebKitGTK is only needed for web views, which this app
      # has none of.
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libgtk-4-dev libwayland-dev

      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

  test:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The Linux backend is GTK 4 (docs/installation); rfd builds against
      # libwayland. WebKitGTK is only needed for web views, which this app
      # has none of.
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libgtk-4-dev libwayland-dev

      # Formatting and lints run in the prek job above (prek.toml);
      # this job only runs the test suite.
      - name: Tests
        run: cargo test --locked

  build:
    name: Build check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check compilation
        run: cargo check --all-targets --locked
