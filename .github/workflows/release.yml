name: Release binaries

# When a GitHub Release is published (tag it, e.g. v0.1.0, then
# "Publish release"): bump Cargo.toml/Cargo.lock to the tag version, then
# build one optimized binary per OS and attach it as a downloadable
# asset.
on:
  release:
    types: [published]

  # Publishing builds the three binaries asynchronously: a release shows no
  # downloads until its run finishes, and none at all if that run fails or
  # never starts (v0.1.1). Dispatching with an existing tag builds that tag
  # and attaches the three binaries to the release it already has.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the three binaries to (e.g. v0.1.1)
        required: true

permissions:
  contents: write

env:
  # The tag this run publishes: a dispatch's input, otherwise the release's
  # own tag. Archive names and the upload target both come from it.
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

# Serialize release runs so two publishes can't race the version commit.
concurrency:
  group: release-flow
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare tag
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      # A dispatch is here to repair an existing release, so it fails fast on a
      # tag without one instead of spending three builds. The upload cannot
      # create a release either (`gh release upload` needs one to exist).
      - name: Require an existing release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout has run yet, so gh cannot infer the repo from a git
          # remote; name it explicitly.
          GH_REPO: ${{ github.repository }}
        run: gh release view "$TAG" > /dev/null

      # A published release bumps main and builds the commit it pushes; a
      # dispatch builds the tag it was given, untouched.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'release' && 'main' || env.TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Bump Cargo.toml and lockfile to tag version
        if: github.event_name == 'release'
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like v1.2.3 (got '$TAG')" >&2
            exit 1
          fi
          VER="${TAG#v}"
          echo "Bumping to $VER"
          sed -i -E "/^\[package\]/,/^\[/ s/^version = \".*\"/version = \"$VER\"/" Cargo.toml
          grep -A3 '^\[package\]' Cargo.toml
          # Rewriting Cargo.toml leaves Cargo.lock recording the old package
          # version, and every build below passes --locked, which refuses to
          # update it. Resolution rewrites the root package entry, so
          # re-resolve just dedupe; `cargo metadata --no-deps` does not touch
          # the lockfile at all.
          cargo update -p dedupe
          if ! grep -A1 '^name = "dedupe"$' Cargo.lock | grep -q "version = \"$VER\""; then
            echo "Cargo.lock does not record dedupe $VER" >&2
            exit 1
          fi
          git diff --stat -- Cargo.toml Cargo.lock
          if git diff --quiet -- Cargo.toml Cargo.lock; then
            echo "Version already at $VER, nothing to commit"
          else
            git add Cargo.toml Cargo.lock
            git -c user.name='dedupe-release' -c user.email='dedupe-release@local' \
              commit -m "Bump version to $VER"
            git push origin HEAD:main
          fi

      # What the OS builds check out: the bump push above, or the dispatch's tag.
      - name: Resolve commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: [prepare]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          # Building needs no token, so keep one out of .git/config while
          # cargo runs this tree's build script.
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libwayland-dev

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "dedupe-${env:TAG}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -LiteralPath `
            "target/${{ matrix.target }}/release/dedupe.exe" `
            -DestinationPath "dist/$name.zip"

      # macOS opens a bare executable in Terminal, so the GUI is shipped as an
      # .app bundle (double-click, no terminal). The bundle is the only binary
      # in the archive; CLI use runs dedupe.app/Contents/MacOS/dedupe.
      #
      # Signing: with the Developer ID secrets set, the bundle is signed with
      # the hardened runtime, notarized and stapled, so it opens with no
      # Gatekeeper prompt. Without them it is ad-hoc signed (first launch shows
      # the unidentified-developer prompt). Secrets:
      #   MACOS_CERTIFICATE_P12       base64 of the "Developer ID Application" .p12
      #   MACOS_CERTIFICATE_PASSWORD  that .p12's export password
      #   APPLE_API_KEY_P8            base64 of an App Store Connect API key (.p8)
      #   APPLE_API_KEY_ID            that key's ID
      #   APPLE_API_ISSUER_ID         the App Store Connect issuer ID
      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          name="dedupe-$TAG-${{ matrix.target }}"
          version="$TAG"
          app=staging/dedupe.app
          mkdir -p dist "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/dedupe" "$app/Contents/MacOS/dedupe"

          # Finder/Dock icon, built from the same logo the GUI shows. The logo
          # is 512px, so the iconset stops at 512x512 (no 512@2x upscale).
          iconset="$RUNNER_TEMP/dedupe.iconset"
          mkdir -p "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icons/logo.png --out "$iconset/icon_${s}x${s}.png" > /dev/null
            d=$((s * 2))
            if [ $d -le 512 ]; then
              sips -z $d $d assets/icons/logo.png --out "$iconset/icon_${s}x${s}@2x.png" > /dev/null
            fi
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/dedupe.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>dedupe</string>
            <key>CFBundleDisplayName</key>
            <string>dedupe</string>
            <key>CFBundleIdentifier</key>
            <string>com.naterminch.dedupe</string>
            <key>CFBundleExecutable</key>
            <string>dedupe</string>
            <key>CFBundleIconFile</key>
            <string>dedupe</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${version#v}</string>
            <key>CFBundleVersion</key>
            <string>${version#v}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          # The bundle must be signed as a whole: the linker's ad-hoc signature
          # covers only the Mach-O, and a downloaded (quarantined) bundle
          # without one is reported "damaged".
          if [ -n "$MACOS_CERTIFICATE_P12" ]; then
            # A throwaway keychain holds the certificate for this job only.
            keychain="$RUNNER_TEMP/signing.keychain-db"
            kc_pass="$(uuidgen)"
            echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$kc_pass" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$kc_pass" "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            identity="$(security find-identity -v -p codesigning "$keychain" \
              | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
            if [ -z "$identity" ]; then
              echo "No Developer ID Application identity in MACOS_CERTIFICATE_P12" >&2
              exit 1
            fi
            echo "Signing as $identity"
            codesign --force --options runtime --timestamp \
              --sign "$identity" --keychain "$keychain" "$app"
            codesign --verify --deep --strict --verbose=2 "$app"

            # Notarize, then staple the ticket so Gatekeeper accepts the app
            # offline too.
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/api_key.p8"
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/dedupe-notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/dedupe-notarize.zip" \
              --key "$RUNNER_TEMP/api_key.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait --timeout 30m
            rm "$RUNNER_TEMP/api_key.p8"
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
            security delete-keychain "$keychain"
          else
            echo "::warning::No Developer ID secrets set: the macOS app is ad-hoc signed and not notarized"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
          fi
          tar -czf "dist/$name.tar.gz" -C staging dedupe.app

      # Linux: the bare binary is both surfaces. Double-clicking an ELF is
      # unreliable across file managers, so the archive also carries a
      # .desktop launcher with `Terminal=false`: opening the GUI from the
      # desktop never spawns a terminal (the binary itself creates none —
      # only an inherited terminal, i.e. a shell run, is ever shown).
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="dedupe-$TAG-${{ matrix.target }}"
          mkdir -p dist staging
          cp "target/${{ matrix.target }}/release/dedupe" staging/dedupe
          cp assets/dedupe.desktop staging/dedupe.desktop
          tar -czf "dist/$name.tar.gz" -C staging dedupe dedupe.desktop

      # `gh release upload` uploads to an existing release and fails when the
      # tag has none, so a release deleted mid-run is not silently recreated:
      # the dispatch guard only checks before the build starts, and
      # softprops/action-gh-release would have created the release here instead.
      # The archive name is spelled out because the Windows runner's pwsh does
      # not expand globs.
      # `--clobber` keeps a re-dispatch from failing on the assets it already made.
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "dist/dedupe-$TAG-${{ matrix.target }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}" --clobber
