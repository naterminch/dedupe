name: Release binaries

# When a GitHub Release is published (tag it, e.g. v0.1.0, then
# "Publish release"): bump Cargo.toml/Cargo.lock to the tag version, then
# build optimized binaries for every OS and attach them as downloadable
# assets (dedupe CLI + dedupe-gui per platform).
on:
  release:
    types: [published]

permissions:
  contents: write

# Serialize release runs so two publishes can't race the version commit.
concurrency:
  group: release-flow
  cancel-in-progress: false

jobs:
  bump-version:
    name: Bump version to tag
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump Cargo.toml and lockfile to tag version
        id: bump
        run: |
          TAG='${{ github.event.release.tag_name }}'
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like v1.2.3 (got '$TAG')" >&2
            exit 1
          fi
          VER="${TAG#v}"
          echo "Bumping to $VER"
          sed -i -E "/^\[package\]/,/^\[/ s/^version = \".*\"/version = \"$VER\"/" Cargo.toml
          grep -A3 '^\[package\]' Cargo.toml
          cargo metadata --format-version=1 --no-deps >/dev/null
          git diff --stat -- Cargo.toml Cargo.lock
          if git diff --quiet -- Cargo.toml Cargo.lock; then
            echo "Version already at $VER, nothing to commit"
          else
            git add Cargo.toml Cargo.lock
            git -c user.name='dedupe-release' -c user.email='dedupe-release@local' \
              commit -m "Bump version to $VER"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: [bump-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "dedupe-${{ github.event.release.tag_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -LiteralPath `
            "target/${{ matrix.target }}/release/dedupe.exe", `
            "target/${{ matrix.target }}/release/dedupe-gui.exe" `
            -DestinationPath "dist/$name.zip"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          name="dedupe-${{ github.event.release.tag_name }}-${{ matrix.target }}"
          mkdir -p dist
          tar -czf "dist/$name.tar.gz" -C "target/${{ matrix.target }}/release" dedupe dedupe-gui

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
