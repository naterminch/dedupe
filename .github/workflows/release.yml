name: Release binaries

# When a GitHub Release is published (tag it, e.g. v0.1.0, then
# "Publish release"): bump Cargo.toml/Cargo.lock to the tag version, then
# build one optimized binary per OS and attach it as a downloadable
# asset.
on:
  release:
    types: [published]

  # Publishing builds the three binaries asynchronously: a release shows no
  # downloads until its run finishes, and none at all if that run fails or
  # never starts (v0.1.1). Dispatching with an existing tag builds that tag
  # and attaches the three binaries to the release it already has.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the three binaries to (e.g. v0.1.1)
        required: true

permissions:
  contents: write

env:
  # The tag this run publishes: a dispatch's input, otherwise the release's
  # own tag. Archive names and the upload target both come from it.
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

# Serialize release runs so two publishes can't race the version commit.
concurrency:
  group: release-flow
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare tag
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      # softprops/action-gh-release creates a release for a tag that has none,
      # so a dispatch — which is here to repair an existing release — refuses
      # tags without one instead of quietly publishing something new.
      - name: Require an existing release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout has run yet, so gh cannot infer the repo from a git
          # remote; name it explicitly.
          GH_REPO: ${{ github.repository }}
        run: gh release view "$TAG" > /dev/null

      # A published release bumps main and builds the commit it pushes; a
      # dispatch builds the tag it was given, untouched.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'release' && 'main' || env.TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Bump Cargo.toml and lockfile to tag version
        if: github.event_name == 'release'
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like v1.2.3 (got '$TAG')" >&2
            exit 1
          fi
          VER="${TAG#v}"
          echo "Bumping to $VER"
          sed -i -E "/^\[package\]/,/^\[/ s/^version = \".*\"/version = \"$VER\"/" Cargo.toml
          grep -A3 '^\[package\]' Cargo.toml
          # Rewriting Cargo.toml leaves Cargo.lock recording the old package
          # version, and every build below passes --locked, which refuses to
          # update it. Resolution rewrites the root package entry, so
          # re-resolve just dedupe; `cargo metadata --no-deps` does not touch
          # the lockfile at all.
          cargo update -p dedupe
          if ! grep -A1 '^name = "dedupe"$' Cargo.lock | grep -q "version = \"$VER\""; then
            echo "Cargo.lock does not record dedupe $VER" >&2
            exit 1
          fi
          git diff --stat -- Cargo.toml Cargo.lock
          if git diff --quiet -- Cargo.toml Cargo.lock; then
            echo "Version already at $VER, nothing to commit"
          else
            git add Cargo.toml Cargo.lock
            git -c user.name='dedupe-release' -c user.email='dedupe-release@local' \
              commit -m "Bump version to $VER"
            git push origin HEAD:main
          fi

      # What the OS builds check out: the bump push above, or the dispatch's tag.
      - name: Resolve commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: [prepare]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          # Building needs no token, so keep one out of .git/config while
          # cargo runs this tree's build script.
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libwayland-dev

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "dedupe-${env:TAG}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -LiteralPath `
            "target/${{ matrix.target }}/release/dedupe.exe" `
            -DestinationPath "dist/$name.zip"

      # macOS opens a bare executable in Terminal, so the GUI is shipped as an
      # .app bundle (double-click, no terminal). The plain binary stays in the
      # archive next to it for CLI use.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          name="dedupe-$TAG-${{ matrix.target }}"
          version="$TAG"
          app=dist/dedupe.app
          mkdir -p dist "$app/Contents/MacOS"
          cp "target/${{ matrix.target }}/release/dedupe" dist/dedupe
          cp "target/${{ matrix.target }}/release/dedupe" "$app/Contents/MacOS/dedupe"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>dedupe</string>
            <key>CFBundleDisplayName</key>
            <string>dedupe</string>
            <key>CFBundleIdentifier</key>
            <string>com.naterminch.dedupe</string>
            <key>CFBundleExecutable</key>
            <string>dedupe</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${version#v}</string>
            <key>CFBundleVersion</key>
            <string>${version#v}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          tar -czf "dist/$name.tar.gz" -C dist dedupe dedupe.app

      # Linux: the bare binary is both surfaces. Double-clicking an ELF is
      # unreliable across file managers, so the archive also carries a
      # .desktop launcher with `Terminal=false`: opening the GUI from the
      # desktop never spawns a terminal (the binary itself creates none —
      # only an inherited terminal, i.e. a shell run, is ever shown).
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="dedupe-$TAG-${{ matrix.target }}"
          mkdir -p dist staging
          cp "target/${{ matrix.target }}/release/dedupe" staging/dedupe
          cp assets/dedupe.desktop staging/dedupe.desktop
          tar -czf "dist/$name.tar.gz" -C staging dedupe dedupe.desktop

      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # Explicit tag: a dispatch has no release event to infer it from.
          tag_name: ${{ env.TAG }}
          # Only the archives: the macOS step leaves the bare binary in dist/
          # next to the .app bundle, and dist/* published that as a stray
          # `dedupe` asset alongside the three archives.
          files: |
            dist/*.zip
            dist/*.tar.gz
